[package]
name = "rklipperscreen"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = "1.9.0"
tokio = { version = "1.37.0", features = ["full"] }
tokio-tungstenite = "0.21.0"
futures-util = "0.3.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5.0"
input = "0.9.0"
udev = "0.8.0"
libc = "0.2.153"

[build-dependencies]
slint-build = "1.9.0"

[profile.release]
lto = true
opt-level = 3