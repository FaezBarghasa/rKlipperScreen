[package]
name = "rklipperscreen"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "1.16.1" }
i-slint-backend-linuxkms = { version = "1.16.1" }
evdev = { version = "0.12", features = ["tokio"] }
tokio = { version = "1.49.0", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
rust-ini = "0.21.3"
fslock = "0.2.1"
minijinja = "2.19.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
gettext = "0.4"
futures-util = "0.3.32"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-tls"] }
zbus = { version = "5.16.0", default-features = false, features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
slint-build = "1.16.1"

[package.metadata.deb]
maintainer = "rKlipperScreen Team <maintainer@rklipperscreen.org>"
copyright = "2026, rKlipperScreen Team"
license-file = ["LICENSE"]
assets = [
    ["target/release/rklipperscreen", "usr/bin/rklipperscreen", "755"],
    ["scripts/KlipperScreen.service", "lib/systemd/system/KlipperScreen.service", "644"],
    ["scripts/99-touchscreen.rules", "lib/udev/rules.d/99-touchscreen.rules", "644"]
]

